<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lang Drill Agent 演示前端 — 1:1 还原主应用三栏学习工作台的展示版前端。" />
    <meta name="theme-color" content="#05070b" />
    <link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="./favicon-light.png" />
    <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="./favicon-dark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>演示前端 · Lang Drill Agent</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("themeMode") || "system";
          var theme =
            stored === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : stored;
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themeMode = stored;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app-main.tsx"></script>
  </body>
</html>
