[project]
name = "langdrill-agent"
version = "0.1.0"
description = "CLI and Web language learning agent built from lang-drill-coach assets."
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0; commercial use requires separate written permission" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0"
]
context-compression = [
  "llmlingua>=0.2.2"
]
paper-parsing = [
  "pypdf>=4.3.0",
  "python-docx>=1.1.2",
  "rapidocr-onnxruntime>=1.2.3"
]

[project.scripts]
langdrill = "langdrill_agent.cli:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
langdrill_agent = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["try"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
