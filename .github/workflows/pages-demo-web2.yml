name: Deploy Demo Web 2 to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages-demo-web2.yml"
      - "演示web2/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 演示web2/package-lock.json

      - name: Install dependencies
        working-directory: 演示web2
        run: npm ci

      - name: Build demo site
        working-directory: 演示web2
        env:
          VITE_BASE_PATH: /lang-drill-agent/
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 演示web2/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
