name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python lint
        run: python -m ruff check backend

      - name: Run Python tests
        shell: pwsh
        run: |
          # tests/ 是提交到仓库的正式契约测试；try/ 是本地调试目录，可不存在。
          if (Test-Path tests) {
            python -m pytest tests -q
          } else {
            Write-Host "tests/ directory missing; skipping contract test suite."
          }
          if (Test-Path try) {
            python -m pytest try -q
          } else {
            Write-Host "try/ is local-only and not committed; skipping try test suite."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

